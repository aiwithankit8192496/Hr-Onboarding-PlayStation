[project]
name = "hr-onboarding"
version = "0.1.0"
description = "Employee onboarding portal with OCR-based document extraction"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "pytesseract",
    "streamlit",
]

[project.scripts]
hr-onboarding = "hr_onboarding:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
